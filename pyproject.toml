[project]
name = "cdn-hadoop-lab"
version = "0.1.0"
description = "Hadoop Cluster on Docker Environment for Study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hdfs>=2.7.3",
    "pandas>=2.0.0",
    "jupyterlab>=4.0.0",
    "nbclassic>=1.0.0",
    "pyarrow>=15.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
